<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tech Bites | Full Stack Java</title>
<meta name="description" content="The Tech Bites: daily Full Stack Java interview questions, Spring Boot, Angular, System Design and Microservices in Hindi.">
<meta property="og:title" content="The Tech Bites | Full Stack Java">
<meta property="og:description" content="Daily Full Stack Java interview questions in Hindi. YouTube, Instagram, Facebook, all in one place.">
<meta name="theme-color" content="#0B0C10">
<link rel="icon" type="image/png" href="logo.png">
<meta property="og:image" content="https://thetechbites.github.io/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0C10; --card:rgba(20,22,32,.72); --line:rgba(255,255,255,.08);
    --cyan:#66FCF1; --violet:#8B5CF6; --gold:#F5C542; --text:#EDEEF2; --muted:#9AA0B0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:Inter,system-ui,sans-serif;
    display:flex; justify-content:center; padding:48px 18px 40px;
    overflow-x:hidden; position:relative;
  }
  /* animated synthwave grid */
  .grid{
    position:fixed; left:-50%; right:-50%; bottom:-10%; height:60vh; z-index:0;
    background-image:
      linear-gradient(rgba(139,92,246,.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(102,252,241,.25) 1px, transparent 1px);
    background-size:60px 60px;
    transform:perspective(500px) rotateX(62deg);
    mask-image:linear-gradient(to top, #000 10%, transparent 85%);
    -webkit-mask-image:linear-gradient(to top, #000 10%, transparent 85%);
    animation:gridmove 4s linear infinite;
  }
  @keyframes gridmove{to{background-position:0 60px,0 0}}
  .glow{position:fixed; border-radius:50%; filter:blur(90px); z-index:0; opacity:.5}
  .g1{width:340px;height:340px;background:var(--violet);top:-80px;left:-80px;animation:float 9s ease-in-out infinite}
  .g2{width:280px;height:280px;background:var(--cyan);top:30%;right:-100px;opacity:.25;animation:float 11s ease-in-out infinite reverse}
  @keyframes float{50%{transform:translate(30px,40px)}}

  main{position:relative; z-index:1; width:100%; max-width:440px}
  .profile{text-align:center; margin-bottom:26px; animation:rise .7s ease both}
  .avatar{
    width:120px;height:120px;border-radius:50%;margin:0 auto 16px;
    display:grid;place-items:center;position:relative;
    background:radial-gradient(circle at 30% 30%, #1d1f2e, #0e0f16);
    font-family:"Space Grotesk";font-weight:700;font-size:34px;
    color:var(--cyan); letter-spacing:-1px;
  }
  .avatar::before{
    content:"";position:absolute;inset:-4px;border-radius:50%;
    background:conic-gradient(var(--violet),var(--cyan),var(--gold),var(--violet));
    z-index:-1; animation:spin 6s linear infinite;
  }
  .avatar::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;z-index:-1}
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-family:"Space Grotesk";font-size:28px;font-weight:700;letter-spacing:-.5px}
  h1 span{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{color:var(--muted);font-size:14.5px;margin-top:8px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
  .chip{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.03)}

  .label{font-family:"Space Grotesk";font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:22px 4px 10px}
  .links{display:flex;flex-direction:column;gap:12px}
  a.btn{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    position:relative;overflow:hidden;transition:transform .2s, border-color .2s, box-shadow .2s;
    animation:rise .6s ease both;
  }
  a.btn:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 30px -10px var(--c)}
  a.btn::after{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
    transform:skewX(-20deg);transition:left .6s;
  }
  a.btn:hover::after{left:120%}
  .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
  .ico svg{width:22px;height:22px}
  .txt b{display:block;font-size:15.5px;font-weight:600}
  .txt small{color:var(--muted);font-size:12.5px}
  .arrow{margin-left:auto;color:var(--muted);transition:transform .2s}
  a.btn:hover .arrow{transform:translateX(4px);color:var(--c)}
  a.featured{border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:linear-gradient(135deg,rgba(245,197,66,.12),rgba(139,92,246,.10))}
  .badge{position:absolute;top:10px;right:12px;font-size:10px;font-weight:700;letter-spacing:1px;color:#0B0C10;background:var(--gold);padding:3px 7px;border-radius:6px}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  footer b{color:var(--cyan);font-weight:600}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>

<main>
  <section class="profile">
    <div class="avatar"><img src="logo.png" alt="The Tech Bites logo"></div>
    <h1>The <span>Tech Bites</span></h1>
    <p class="tag">Daily Full Stack Java interview questions in Hindi.<br>Learn it once, answer it with confidence.</p>
    <div class="chips">
      <span class="chip">Java</span><span class="chip">Spring Boot</span><span class="chip">Angular</span>
      <span class="chip">System Design</span><span class="chip">Microservices</span><span class="chip">Kafka</span>
    </div>
  </section>

  <div class="label">Watch</div>
  <div class="links" id="watch"></div>

  <div class="label">Follow</div>
  <div class="links" id="follow"></div>

  <footer>Made with <b>Java</b> energy &middot; &copy; <span id="yr"></span> The Tech Bites</footer>
</main>

<script>
/* ==== EDIT LINKS HERE ==== (empty url = button hidden) */
const LINKS = {
  watch: [
    { title:"YouTube Channel", sub:"Daily Shorts at 9 AM + weekend long videos", url:"https://www.youtube.com/@TheTechBites-vk?sub_confirmation=1", icon:"yt", color:"#FF4D4D", featured:true, badge:"SUBSCRIBE" },
    { title:"Latest Long Video", sub:"Microservices: Service Discovery", url:"https://youtu.be/rB1-hQ6_9AQ", icon:"play", color:"#66FCF1" },
    { title:"All Playlists", sub:"System Design, Microservices, Interview Shorts", url:"https://www.youtube.com/@TheTechBites-vk/playlists", icon:"list", color:"#8B5CF6" }
  ],
  follow: [
    { title:"Instagram", sub:"@the.tech.bites: Java & Spring Boot reels", url:"https://www.instagram.com/the.tech.bites/", icon:"ig", color:"#F5C542" },
    { title:"Instagram", sub:"@visualcode.dev: algorithm visuals", url:"https://www.instagram.com/visualcode.dev/", icon:"ig", color:"#66FCF1" },
    { title:"Facebook Page", sub:"The Tech Bites", url:"https://www.facebook.com/TheTechBites", icon:"fb", color:"#4D8BFF" },
    { title:"Telegram", sub:"New video alerts", url:"", icon:"tg", color:"#4FC3F7" }
  ]
};

const ICONS = {
  yt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.75 15.02V8.98L15.5 12z"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h12M4 12h12M4 18h8M19 15v6l4-3z"/></svg>',
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  fb:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H7v4h3v8h4v-8h3l1-4h-4V8.5c0-.3.2-.5.5-.5z"/></svg>',
  tg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.2-8.3c.4-.4-.1-.6-.6-.2L6.1 13.2 1.2 11.7c-1-.3-1.1-1 .2-1.5L20.6 2.9c.9-.3 1.6.2 1.3 1.4z"/></svg>'
};

function render(id, items){
  const box = document.getElementById(id);
  items.filter(l => l.url).forEach((l, i) => {
    const a = document.createElement('a');
    a.className = 'btn' + (l.featured ? ' featured' : '');
    a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
    a.style.setProperty('--c', l.color);
    a.style.animationDelay = (0.15 + i * 0.08) + 's';
    a.innerHTML = `<span class="ico">${ICONS[l.icon]}</span>
      <span class="txt"><b>${l.title}</b><small>${l.sub}</small></span>
      ${l.badge ? `<span class="badge">${l.badge}</span>` : '<span class="arrow">&rarr;</span>'}`;
    box.appendChild(a);
  });
}
render('watch', LINKS.watch);
render('follow', LINKS.follow);
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
